<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Topshiriqlar va Qarorlar Monitoringi Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- SheetJS (Haqiqiy Excel .xlsx) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #071311;
            color: #f0fdf8;
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0b1a17; }
        ::-webkit-scrollbar-thumb { background: #1b3d35; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #2ec4b6; }
    </style>
</head>
<body class="min-h-screen bg-[#071311] text-[#f0fdf8] flex flex-col antialiased selection:bg-[#2ec4b6]/30 selection:text-white">

    <!-- Navbar -->
    <header class="border-b border-[#18332d] bg-[#0b1a17]/90 backdrop-blur sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-[#102420] border border-[#2ec4b6]/30 text-[#2ec4b6] p-2.5 rounded-xl shadow-lg shadow-[#2ec4b6]/10">
                    <i class="fa-solid fa-tree text-lg"></i>
                </div>
                <div>
                    <h1 class="text-base sm:text-lg font-bold text-[#f0fdf8] tracking-tight flex items-center gap-2">
                        Topshiriqlar Monitoringi
                        <span class="text-[10px] font-semibold px-2 py-0.5 rounded-full bg-[#2ec4b6]/10 text-[#2ec4b6] border border-[#2ec4b6]/20">SPA v2.5</span>
                    </h1>
                    <p class="text-xs text-[#8fa99e]">Nordic Forest & Deep Sage interfeysi</p>
                </div>
            </div>
            <div class="flex items-center space-x-2 sm:space-x-3">
                <!-- Excel Export -->
                <button onclick="exportToExcel()" class="px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-[#112420] hover:bg-[#16332d] text-[#10b981] border border-[#1e3d36] transition flex items-center gap-1.5" title="Excel (.xlsx) yuklab olish">
                    <i class="fa-solid fa-file-excel text-sm"></i> <span class="hidden md:inline">Excel</span> (.xlsx)
                </button>
                <!-- Zaxira olish -->
                <button onclick="exportJSON()" class="px-3 py-1.5 rounded-xl text-xs font-semibold bg-[#112420] hover:bg-[#16332d] text-[#8fa99e] hover:text-[#f0fdf8] border border-[#1e3d36] transition flex items-center gap-1.5" title="JSON nusxa olish">
                    <i class="fa-solid fa-download text-[#2ec4b6]"></i> <span class="hidden lg:inline">Zaxira</span>
                </button>
                <label class="cursor-pointer px-3 py-1.5 rounded-xl text-xs font-semibold bg-[#112420] hover:bg-[#16332d] text-[#8fa99e] hover:text-[#f0fdf8] border border-[#1e3d36] transition flex items-center gap-1.5" title="Zaxirani tiklash">
                    <i class="fa-solid fa-upload text-[#e09f3e]"></i>
                    <input type="file" id="importFileInput" accept=".json" class="hidden" onchange="importJSON(event)">
                </label>
                <!-- Modallar -->
                <button onclick="openModal('decreeModal')" class="px-3 py-1.5 rounded-xl text-xs font-semibold bg-[#112420] hover:bg-[#16332d] text-[#8fa99e] hover:text-[#f0fdf8] border border-[#1e3d36] transition flex items-center gap-1.5">
                    <i class="fa-solid fa-plus text-[#2ec4b6]"></i> <span class="hidden sm:inline">
